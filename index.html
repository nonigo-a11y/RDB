<title>RDB</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@500;700;800&family=Open+Sans:wght@400;600;700&display=swap">
<style>

button{cursor:pointer}

.wrap{max-width:1100px;margin:0 auto;padding:16px}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1.5px solid #CFC7B8;background:var(--card);font-weight:600}

.btn.danger{color:var(--brick);border-color:var(--brick)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.chip{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:15px}
.chip.on{background:var(--brick);border-color:var(--brick);color:#FFFFFF;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}

h1{font-size:26px;font-weight:800} h2{font-size:19px;font-weight:700}
.sub{margin:0;font-size:14px;color:var(--mute)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sp{justify-content:space-between}
.tabs{position:fixed;inset-inline:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:30}

.empty{text-align:center;color:var(--mute);padding:28px 8px}

<script>

function fam(){var f=(S.cfg&&S.cfg.fam)||{};return{a:Math.max(1,f.a==null?2:+f.a),k:Math.max(0,f.k==null?3:+f.k)}}

function rec(id){return S.recipes.filter(function(r){return r.id===id})[0]}

/* ---------- parsing ---------- */
var UN={'גרם':'g','גר':'g',"גר'":'g','ג׳':'g','קג':'kg','ק״ג':'kg','ק"ג':'kg','קילו':'kg','קילוגרם':'kg','מל':'ml','מ״ל':'ml','מ"ל':'ml','ליטר':'l','כוס':'cup','כוסות':'cup','כף':'tbsp','כפות':'tbsp','כפית':'tsp','כפיות':'tsp','שן':'clove','שיני':'clove','שיניים':'clove','חבילה':'pack','חבילות':'pack','קופסה':'can','קופסת':'can','קופסאות':'can','פרוסה':'slice','פרוסות':'slice','חופן':'handful','יחידה':'unit','יחידות':'unit',"יח'":'unit','יח׳':'unit'};

function num(s){s=s.trim();var f={'½':.5,'¼':.25,'¾':.75,'⅓':.33,'⅔':.67,'חצי':.5,'רבע':.25};if(f[s]!=null)return f[s];
 var m=s.match(/^(\d+)\s+(\d+)\/(\d+)$/);if(m)return +m[1]+(+m[2])/(+m[3]);m=s.match(/^(\d+)\/(\d+)$/);if(m)return (+m[1])/(+m[2]);return parseFloat(s.replace(',','.'))}
function parseIng(line){
 var raw=line.trim(),s=raw;
 var a=new RegExp('^'+NUM+'(?:\\s*-\\s*\\d+(?:[.,]\\d+)?)?\\s*(?:('+UNRE+')(?=\\s|$))?\\s*(?:של\\s+)?(.+)$').exec(s);
 if(a&&a[3]&&!/^\d/.test(a[3])){var u=a[2]?UN[a[2]]:'unit';return{raw:raw,qty:num(a[1]),unit:u,name:a[3].trim()}}
 var b=new RegExp('^(.+?)\\s*[-–:]\\s*'+NUM+'\\s*(?:('+UNRE+')(?=\\s|$))?\\s*$').exec(s);
 if(b){return{raw:raw,qty:num(b[2]),unit:b[3]?UN[b[3]]:'unit',name:b[1].trim()}}
 return{raw:raw,qty:null,unit:'',name:raw}}
function clean(l){return l.replace(/[‎‏]/g,'').replace(/\p{Extended_Pictographic}️?/gu,'').replace(/^[\s\-–—*•·●○▪▫✔✅]+/,'').trim()}
function durs(l){var o=[],m,re;
 if(/שעה וחצי/.test(l))o.push(90);else if(/שעתיים/.test(l))o.push(120);else if(/חצי שעה/.test(l))o.push(30);else if(/רבע שעה/.test(l))o.push(15);
 re=/(\d+(?:[.,]\d+)?)(?:\s*[-–]\s*(\d+(?:[.,]\d+)?))?\s*(דקות|דקה|דק׳|דק'|דק|שעות|שעה|שע׳|שע')(?!\S*\s*של)/g;
 while((m=re.exec(l))){var v=Math.max(parseFloat(m[1].replace(',','.')),m[2]?parseFloat(m[2].replace(',','.')):0);if(/^ש/.test(m[3]))v*=60;o.push(Math.round(v))}
 return o}
var PASSRE=/אפייה|אפיה|אופים|בתנור|מבשלים|בישול|תפיחה|תופח|מצננים|קירור|מקפיאים|הקפאה|מרתיחים|מנוחה|להמתין|המתנה|מבשל|מאדים|אידוי/;
function parseRecipe(raw){
 var lines=raw.replace(/\r/g,'').split('\n').map(clean).filter(function(l){return l&&!/^(#\S+\s*)+$/.test(l)});
 var ING=/^(מצרכים|מרכיבים|חומרים|רכיבים|ingredients)\s*:?\s*$/i,STP=/^(אופן ההכנה|אופן הכנה|הוראות הכנה|הוראות|שיטת הכנה|הכנה|שלבי הכנה|instructions|directions|method)\s*:?\s*$/i;
 var tm={prep:null,pass:null,total:null,inf:0},out={title:'',servings:4,prep:20,pass:0,ings:[],steps:[]},mode=null,hasSec=lines.some(function(l){return ING.test(l)||STP.test(l)}),rest=[];
 lines.forEach(function(l){

  if(dl.length&&mode!=='stp'&&mode!=='ing'&&l.length<90){
   var lab=false,seg=l.split(/[|•·;]|\s{2,}|\s+(?=(?:זמן\s)?(?:הכנה|עבודה|אפייה|אפיה|בישול|כולל|סה"כ))/);
   seg.forEach(function(sg){var d2=durs(sg);if(!d2.length)return;var v=d2[0];

function fq(q){var w=Math.floor(q+.001),f=q-w,F={0:'',.25:'¼',.33:'⅓',.5:'½',.67:'⅔',.75:'¾'},best='',bd=.06;

  if(h<1)t='חצי '+un;else if(h===1)t=un;else if(w===1)t=un+' וחצי';else t=w+(half?' וחצי ':' ')+un;
  return (t+' '+name).replace(/\s+/g,' ').trim()}return (qs+' '+lab+' '+name).replace(/\s+/g,' ').trim()}
function norm(s){return s.toLowerCase().replace(/[^֐-׿a-z0-9 ]/g,'').replace(/\s+/g,' ').trim()}

/* ---------- shopping units ---------- */
var PR=[
 ['garlic',/שום/,'שן שום','שיני שום','','',0],
 ['sweetpot',/בטטה|בטטות/,'בטטה','בטטות','בינונית','בינוניות',250],

 ['carrot',/גזר/,'גזר','גזרים','בינוני','בינוניים',80],
 ['pepper',/^(?!.*מלח)(?!.*פלפל\s*(שחור|לבן|גרוס|אנגלי|חריף|קאיין|מיובש|טחון)).*פלפל/,'פלפל','פלפלים','בינוני','בינוניים',150],
